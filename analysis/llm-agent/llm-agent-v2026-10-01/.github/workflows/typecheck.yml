# ═══════════════════════════════════════════════════════════════════════
# GitHub Actions workflow — typecheck (mypy)
# Рекомендация 6 (Sprint 2, P1)
# ═══════════════════════════════════════════════════════════════════════
# Триггеры:
#   - push в main/develop
#   - pull_request в main
#
# Что делает:
#   1. Поднимает Python 3.11 (базовая версия проекта)
#   2. Ставит зависимости из requirements.txt + requirements-dev.txt
#   3. Прогоняет mypy с mypy.ini конфигом
#   4. Загружает отчёт о покрытии типов как артефакт (10 дней)
#
# Стратегия: gradual typing. Сначала мойка — non-blocking (continue-on-error),
# чтобы не блокировать разработку. После 4-х недель зелёного — перевести в
# blocking (убрать continue-on-error).
# ═══════════════════════════════════════════════════════════════════════
name: Type Check

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'mypy.ini'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'mypy.ini'
      - 'pyproject.toml'

# Отмена предыдущих запусков того же PR при новом push
concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # shallow clone — mypy не нужна история

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'            # кэшируем pip-зависимости
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Сначала dev-зависимости (включая mypy)
          pip install -r requirements-dev.txt
          # Затем основные (многие дублируются — pip пропустит)
          pip install -r requirements.txt
          # Установить сам пакет в editable-режиме — mypy найдёт src.* через setup.py
          pip install -e .

      - name: Run mypy
        id: mypy
        # continue-on-error: true  ← раскомментировать на первые 4 недели
        #                          (gradual typing, не блокирует разработку)
        run: |
          mkdir -p .mypy-cache
          mypy --config-file mypy.ini src/
          # Сохраняем exit code для use в следующих шагах
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Upload mypy report
        if: always()  # даже при ошибке
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report
          path: |
            .mypy-cache/
          retention-days: 10

      - name: Check coverage (optional)
        # Опционально: посчитать процент покрытия типами
        if: always()
        run: |
          echo "## Mypy Type Check Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.mypy.outputs.exit_code }}" = "0" ]; then
            echo "✅ PASS — all type checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ FAIL — see log for details" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Strategy: gradual typing. See \`mypy.ini\` for strict modules list." >> $GITHUB_STEP_SUMMARY
          fi
