# ═══════════════════════════════════════════════════════════════════════
# GitHub Actions workflow — pytest (каркас для рекомендации 7)
# Sprint 2-3 (P1) — ТЕСТОВОЕ ПОКРЫТИЕ
# ═══════════════════════════════════════════════════════════════════════
# Этот workflow запускает pytest на каждом push/PR.
# Сейчас в проекте 5 тестов в tests/ + 15 в scripts/test_*.py — каркас.
# Дальше (рекомендация 7, Sprint 3) добавляем тесты на:
#   - src/orchestrator.py
#   - src/llm_client.py
#   - src/journal/recorder.py
#   - src/memory/facade.py
# ═══════════════════════════════════════════════════════════════════════
name: Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/test_**.py'
      - 'pytest.ini'
      - 'requirements.txt'
      - 'requirements-dev.txt'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'

# Отмена предыдущих запусков того же PR при новом push
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ['3.11', '3.12']
        # TODO (Sprint 3): добавить '3.13' и '3.13t' (free-threaded)
        # free-threaded требует отдельный контейнер — см. python-free-threaded
      fail-fast: false  # если упало на 3.11, всё равно прогнать 3.12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt
          pip install -e .

      - name: Install Playwright browsers (optional)
        # Только если в тестах используется browser MCP
        run: |
          pip install playwright
          playwright install chromium --with-deps --no-shell
        continue-on-error: true  # не блокировать тесты если не нужно

      - name: Run tests with coverage
        env:
          # Тесты не должны ходить в реальную сеть/LLM
          OPENAI_API_KEY: "test-key"
          DEEPSEEK_API_KEY: "test-key"
          PROJECT_ROOT: ${{ github.workspace }}
          PG_ENABLED: "false"        # отключаем PostgreSQL в CI
          PG_REPLICATE: "0"
          AGENT_MEMORY: "0"          # отключаем фоновую индексацию
        run: |
          # pytest.ini уже есть в корне проекта (1 строка)
          pytest \
            --cov=src \
            --cov=tests \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --junitxml=test-results.xml \
            --maxfail=5 \
            --color=yes \
            -v
        continue-on-error: true  # gradual: не блокировать первые 2 недели

      - name: Upload coverage report (Codecov)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}  # добавить секрет в репо

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
            htmlcov/
          retention-days: 14

      - name: Test summary
        if: always()
        run: |
          echo "## Test Results (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results.xml ]; then
            tests=$(grep -c 'testcase ' test-results.xml || echo "0")
            failures=$(grep -c '<failure' test-results.xml || echo "0")
            echo "- Total tests: $tests" >> $GITHUB_STEP_SUMMARY
            echo "- Failures: $failures" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f coverage.xml ]; then
            coverage=$(python -c "import xml.etree.ElementTree as ET; t=ET.parse('coverage.xml'); print(t.getroot().attrib.get('line-rate', '0'))" 2>/dev/null || echo "0")
            echo "- Coverage: $(printf '%.1f%%' $(echo "$coverage * 100" | bc))" >> $GITHUB_STEP_SUMMARY
          fi
